/* =========================================================
   BILAN (adulte) + EXPORTS
   ========================================================= */
function niveauDe(rep,score,fini){
  if(!rep.length) return 'Non évalué';
  if(!fini) return 'Thème non terminé';
  if(rep.length<CFG.NB_Q) return 'Arrêté après Q'+rep.length+' — suite non évaluée';
  if(score===0) return 'À reprendre';
  if(score<=2) return 'En cours d’acquisition';
  if(score<=4) return 'Acquis';
  return 'Maîtrisé';
}
function pip(r){return r?((r.passe?'↷':r.ok?'✔':'✘')+(r.essai1?'²':'')+(r.qcm&&r.ok?'?':'')+(r.aide?'*':'')+(r.sorties?'⚠':'')):'·';}
function noteSortie(r){return r&&r.sorties?'⚠ fenêtre quittée ×'+r.sorties+(r.horsFenetre?' ('+duree(r.horsFenetre)+')':''):'';}
const LEGENDE='✔ juste · ✘ faux · ↷ passée · · non posée · ² au 2e essai (1er essai raté) · ? QCM réussi (hasard possible) · * aide apportée · ⚠ fenêtre quittée pendant la question';
function duree(ms){if(!ms)return '';const s=Math.round(ms/1000);return s<60?s+' s':Math.floor(s/60)+' min '+String(s%60).padStart(2,'0');}
function erreursRelevees(b){
  const L=[];
  b.lignes.forEach(function(l){l.rep.forEach(function(r,k){
    if(r.essai1&&r.essai1.erreur) L.push({th:l.th,q:'Q1 (1er essai)',e:r.essai1.erreur});
    if(r.erreur) L.push({th:l.th,q:'Q'+(k+1),e:r.erreur});
  });});
  return L;
}
function lignesDetail(r,k){
  const out=[];
  if(r.essai1) out.push({q:'Q1 (1er essai)',r:r.essai1});
  out.push({q:'Q'+(k+1),r:r});
  return out;
}
function bilan(){
  let total=0,posees=0,aides=0;
  const lignes=visibles().map(function(th){
    const et=S.res[th.id],rep=et?et.rep:[];
    const score=rep.filter(r=>r.ok).length,aide=rep.filter(r=>r.aide).length;
    total+=score;posees+=rep.length;aides+=aide;
    return {th:th,rep:rep,score:score,aide:aide,niveau:niveauDe(rep,score,!!(et&&et.fini)),etat:!rep.length?'non évalué':(et.fini?(et.stop?'arrêté':'terminé'):'en cours')};
  });
  const max=visibles().length*CFG.NB_Q;
  return {lignes:lignes,total:total,max:max,posees:posees,aides:aides,pct:Math.round(100*total/max)};
}
function priorites(b){
  return b.lignes.filter(l=>l.rep.length&&l.etat!=='en cours'&&l.score<=2).sort((x,y)=>x.score-y.score).map(l=>l.th.titre+' ('+l.score+'/'+CFG.NB_Q+')');
}
function texteBilan(){
  const b=bilan(),d=new Date();
  const L=[];
  L.push('DÉFI MATHS CM2 — Bilan');
  L.push('Élève : '+(S.prenom||'(non renseigné)'));
  L.push('Date : '+d.toLocaleDateString('fr-FR'));
  L.push('Score global : '+b.total+'/'+b.max+' ('+b.pct+' %) — questions posées : '+b.posees+' — avec aide : '+b.aides);
  L.push('');
  b.lignes.forEach(function(l){
    L.push(pad(l.th.titre,26)+' '+(l.rep.length?l.score+'/'+CFG.NB_Q:'—/'+CFG.NB_Q)+'  '+[0,1,2,3,4].map(k=>pip(l.rep[k])).join(' ')+'  '+l.niveau);
  });
  const p=priorites(b);
  L.push('');
  L.push('Priorités : '+(p.length?p.join(' ; '):'aucune'));
  const er=erreursRelevees(b);
  L.push('');
  const cc=carteComp();
  L.push('PRÉREQUIS TRANSVERSAUX');
  TRANSV.forEach(function(g){L.push('  '+pad(g.lib,48)+' '+infoGroupe(cc,g.c).txt);});
  L.push('');
  L.push('PRIORITÉS (ordonnées par prérequis)');
  const pr=prioritesComp(cc);
  if(!pr.length) L.push('  aucune');
  pr.forEach(function(p,i){L.push('  '+(i+1)+'. '+p.lib+' — '+ST_LIB[p.statut]+(p.causes.length?' — cause probable : '+p.causes.join(', '):'')+(p.avant.length?' — consolider d’abord : '+p.avant.join(', '):''));});
  L.push('');
  L.push('CARTE DES COMPÉTENCES');
  visibles().forEach(function(th){
    const ids=Object.keys(COMP).filter(id=>COMP[id].d===th.id);
    L.push('  '+th.titre);
    ids.forEach(function(id){const o=cc[id];L.push('    '+pad(ST_LIB[o.statut],12)+COMP[id].lib+(o.motifs.length?' ['+o.motifs.join(' ; ')+']':'')+(o.erreurs.length?' — '+o.erreurs.map(x=>x.q+' : '+x.e).join(' ; '):''));});
  });
  L.push('');
  L.push('ERREURS REPÉRÉES');
  if(!er.length) L.push('  aucune');
  er.forEach(function(x){L.push('  - '+x.th.titre+' '+x.q+' : '+x.e);});
  L.push('');
  L.push('DÉTAIL DES RÉPONSES');
  b.lignes.forEach(function(l){
    if(!l.rep.length) return;
    L.push('');
    L.push(l.th.titre.toUpperCase());
    l.rep.forEach(function(r,k){lignesDetail(r,k).forEach(function(x){
      const r2=x.r;
      L.push('  '+x.q+' '+pip(r2)+'  '+(r2.enonce||''));
      L.push('      attendu : '+(r2.attendu||'—')+'   donné : '+(r2.donne||'—')+(r2.duree?'   durée : '+duree(r2.duree):''));
      if(r2.brouillon) L.push('      brouillon : '+r2.brouillon);
      if(r2.erreur) L.push('      erreur : '+r2.erreur);
      if(r2.sorties) L.push('      '+noteSortie(r2));
    });});
  });
  L.push('');
  L.push('Légende : '+LEGENDE);
  L.push('Niveaux : 0/5 À reprendre — 1-2 En cours d’acquisition — 3-4 Acquis — 5 Maîtrisé');
  return L.join('\n');
}

  return JSON.stringify({
    outil:'Défi Maths CM2',version:CFG.VERSION,eleve:S.prenom||null,debut:S.debut,export:new Date().toISOString(),
    scoreGlobal:{points:b.total,sur:b.max,pourcent:b.pct,posees:b.posees,avecAide:b.aides},
    themes:b.lignes.map(l=>({id:l.th.id,titre:l.th.titre,score:l.score,sur:CFG.NB_Q,niveau:l.niveau,etat:l.etat,
      reponses:l.rep.map((r,k)=>({q:k+1,juste:!!r.ok,passee:!!r.passe,aide:!!r.aide,enonce:r.enonce||'',attendu:r.attendu||'',donne:r.donne||'',brouillon:r.brouillon||'',erreur:r.erreur||'',dureeMs:r.duree||0,qcm:!!r.qcm,
        premierEssai:r.essai1?{juste:!!r.essai1.ok,donne:r.essai1.donne||'',erreur:r.essai1.erreur||'',dureeMs:r.essai1.duree||0}:null}))})),
    erreursReperees:erreursRelevees(b).map(x=>({theme:x.th.titre,question:x.q,erreur:x.e,cause:causeDe(x.e)})),
    competences:(function(){const cc=carteComp();return Object.keys(COMP).map(id=>({id:id,lib:COMP[id].lib,domaine:COMP[id].d,prerequis:COMP[id].pre||[],statut:ST_LIB[cc[id].statut],motifsFragilite:cc[id].motifs,erreurs:cc[id].erreurs,causes:cc[id].causes}));})(),
    prerequisTransversaux:(function(){const cc=carteComp();return TRANSV.map(g=>{const i=infoGroupe(cc,g.c);return {lib:g.lib,statut:ST_LIB_G[i.statut],evaluees:i.ev,total:i.n,competences:g.c};});})(),
    priorites:prioritesComp(carteComp()).map(p=>({competence:p.id,lib:p.lib,statut:ST_LIB[p.statut],causes:p.causes,consoliderDabord:p.avant}))
  },null,2);
}
function telecharger(nom,contenu,mime){
  const url=URL.createObjectURL(new Blob([contenu],{type:mime+';charset=utf-8'}));
  const a=h('a',{href:url,download:nom});
  document.body.append(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},500);
}
function copier(txt,btn){
  const ok=function(){const t=btn.textContent;btn.textContent='Copié ✔';setTimeout(function(){btn.textContent=t;},1800);};
  const repli=function(){
    const ta=h('textarea',{style:'position:fixed;opacity:0'});ta.value=txt;document.body.append(ta);ta.select();
    try{document.execCommand('copy');ok();}catch(_){}
    ta.remove();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok,repli); else repli();
}

/* =========================================================
   CODE ACCOMPAGNANT
   ========================================================= */
let codeActif=null;
/* SHA-256 (vanilla, sans bibliothèque) : empreinte du code accompagnant */
function sha256(ascii){
  function rr(v,n){return (v>>>n)|(v<<(32-n));}
  const maxWord=Math.pow(2,32);let i,j,result='';
  const words=[],bitLen=ascii.length*8;
  const hash0=[],k=[];let n=0;const comp={};
  for(let c=2;n<64;c++){if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;hash0[n]=(Math.pow(c,.5)*maxWord)|0;k[n++]=(Math.pow(c,1/3)*maxWord)|0;}}
  let hash=hash0.slice(0,8);
  ascii+='\x80';
  while(ascii.length%64-56) ascii+='\x00';
  for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return null;words[i>>2]|=j<<((3-i)%4)*8;}
  words[words.length]=(bitLen/maxWord)|0;
  words[words.length]=bitLen;
  for(j=0;j<words.length;){
    const w=words.slice(j,j+=16),old=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);
      hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++) for(j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=(b<16?'0':'')+b.toString(16);}
  return result;
}
window.defiMathsEmpreinte=function(c){return sha256(CFG.CODE_SEL+String(c));};
function demanderCode(suite){
  let saisie='';
  const pts=h('div',{class:'code-pts','aria-live':'polite'});
  const msg=h('p',{class:'code-msg',role:'status'});
  const maj=function(){pts.textContent='●'.repeat(saisie.length)+'○'.repeat(4-saisie.length);};
  const frap=function(k){
    if(k==='⌫'){saisie=saisie.slice(0,-1);msg.textContent='';}
    else if(/^[0-9]$/.test(k)&&saisie.length<4){saisie+=k;msg.textContent='';}
    maj();
    if(saisie.length===4){
      if(sha256(CFG.CODE_SEL+saisie)===CFG.CODE_EMPREINTE){suite();return;}
      msg.textContent='Code incorrect.';saisie='';maj();
    }
  };
  ecran(h('div',{class:'carte retour'},
    h('h2',{text:'🔒 Espace accompagnant'}),
    h('p',{text:'Entre le code à 4 chiffres.'}),
    pts,msg,clavier(frap,true),
    h('div',{class:'actions'},h('button',{type:'button',class:'btn',text:'Annuler',onclick:function(){if(Object.keys(S.res).length)vueCarte();else vueAccueil();}}))));
  maj();
  codeActif=frap;
}

/* =========================================================
   PROTECTION DE L'ÉCRAN DE QUESTION (anti copier-coller / capture)
   Active seulement pendant une question (body.protege).
   ========================================================= */
const protege=()=>document.body.classList.contains('protege');
['copy','cut','contextmenu','selectstart','dragstart'].forEach(function(t){
  document.addEventListener(t,function(e){if(protege())e.preventDefault();},true);
});
document.addEventListener('keydown',function(e){
  if(protege()&&(e.ctrlKey||e.metaKey)&&/^[acxpsu]$/i.test(e.key)){e.preventDefault();e.stopPropagation();}
},true);
function sortieFenetre(){
  if(!protege()||document.body.classList.contains('voile')) return;
  document.body.classList.add('voile');
  Voix.stop();
  Q.sorties=(Q.sorties||0)+1;Q.sortieT0=Date.now();
}
function retourFenetre(){
  if(!document.body.classList.contains('voile')) return;
  document.body.classList.remove('voile');
  if(Q.sortieT0){Q.horsFenetre=(Q.horsFenetre||0)+(Date.now()-Q.sortieT0);Q.sortieT0=0;}
}
document.addEventListener('keyup',function(e){
  if(protege()&&(e.key==='PrintScreen'||e.key==='Snapshot')){
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText('').catch(function(){});}catch(_){}
    sortieFenetre();
  }
},true);
window.addEventListener('blur',sortieFenetre);
document.addEventListener('visibilitychange',function(){if(document.hidden)sortieFenetre();});
$('#voile').addEventListener('click',function(){if(document.hasFocus())retourFenetre();});
window.addEventListener('focus',function(){setTimeout(retourFenetre,400);});

document.addEventListener('keydown',function(e){
  if(codeActif){const k=toucheClavier(e);if(k&&k!==','){e.preventDefault();codeActif(k);}return;}
  if(!Q.actif||!Q.rend) return;
  if(Q.rend.touche&&Q.rend.touche(e)){e.preventDefault();return;}
  if(e.key==='Enter'&&Q.rend.ready()&&!(e.target.closest&&e.target.closest('button'))){e.preventDefault();valider();}
});
$('#btnAdulte').addEventListener('click',function(){demanderCode(vueAdulte);});
$('#logo').addEventListener('click',function(){if(Object.keys(S.res).length)vueCarte();else vueAccueil();});

charger();
Voix.init();
vueAccueil();
})();
